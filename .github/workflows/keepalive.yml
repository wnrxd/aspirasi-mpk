name: Supabase Keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping get_stats
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_stats" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
